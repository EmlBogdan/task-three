server: 
  log_level: info
metrics: 
  global: 
    scrape_interval: 15s 
    remote_write: 
      - url: https://prometheus.universal-domain.online/api/v1/write
  configs: 
    - name: llm-agent 
      scrape_configs: 
        - job_name: node
          static_configs:
            - targets: ["127.0.0.1:11434"]

integrations:
  node_exporter:
    enabled: true
    include_exporter_metrics: true