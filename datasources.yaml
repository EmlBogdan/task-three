apiVersion: 1

datasources:
  - name: CloudWatch
    type: cloudwatch
    uid: cloudwatch-ds
    isDefault: false
    jsonData:
      authType: default
      defaultRegion: us-east-1

  - name: Prometheus
    type: prometheus
    uid: prometheus-ds
    access: proxy
    url: http://localhost:9090
    jsonData:
      httpMethod: POST
      timeInterval: 15s
  
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager-ds
    access: proxy
    url: http://127.0.0.1:9093
    jsonData:
      implementation: prometheus
      handleGrafanaManagedAlerts: true
    isDefault: false
    editable: false