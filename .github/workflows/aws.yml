# This workflow will build and push a new container image to Amazon ECR,
# and then will deploy a new task definition to Amazon ECS, when there is a push to the "main" branch.
#
# To use this workflow, you will need to complete the following set-up steps:
#
# 1. Create an ECR repository to store your images.
#    For example: `aws ecr create-repository --repository-name my-ecr-repo --region us-east-2`.
#    Replace the value of the `ECR_REPOSITORY` environment variable in the workflow below with your repository's name.
#    Replace the value of the `AWS_REGION` environment variable in the workflow below with your repository's region.
#
# 2. Create an ECS task definition, an ECS cluster, and an ECS service.
#    For example, follow the Getting Started guide on the ECS console:
#      https://us-east-2.console.aws.amazon.com/ecs/home?region=us-east-2#/firstRun
#    Replace the value of the `ECS_SERVICE` environment variable in the workflow below with the name you set for the Amazon ECS service.
#    Replace the value of the `ECS_CLUSTER` environment variable in the workflow below with the name you set for the cluster.
#
# 3. Store your ECS task definition as a JSON file in your repository.
#    The format should follow the output of `aws ecs register-task-definition --generate-cli-skeleton`.
#    Replace the value of the `ECS_TASK_DEFINITION` environment variable in the workflow below with the path to the JSON file.
#    Replace the value of the `CONTAINER_NAME` environment variable in the workflow below with the name of the container
#    in the `containerDefinitions` section of the task definition.
#
# 4. Store an IAM user access key in GitHub Actions secrets named `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`.
#    See the documentation for each action used below for the recommended IAM policies for this IAM user,
#    and best practices on handling the access key credentials.

name: Deploy to Amazon ECS

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v6.2.3
      with:
        role-to-assume: ${{secrets.AWS_IAM_ROLE}}
        aws-region: us-east-1
        role-session-name: GHActionsSession

    - name: test aws credentials
      run: aws sts get-caller-identity

    - name: Login to Amazon ECR
      id: login-ecr
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
      run: | 
        aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REPOSITORY

    - name: Build ollama image 
      id: build-image
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
      run: |
        docker build -t ollama:latest -f ollama.Dockerfile .
    
    - name: Tag ollama image 
      id: tag-image
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        IMAGE_TAG: ollama
      run: |
        docker tag ollama:latest ollama:$IMAGE_TAG
        docker tag ollama:${IMAGE_TAG} $ECR_REPOSITORY:${IMAGE_TAG}
    
    - name: Pull webui image 
      id: build-webui-image
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
      run: |
        docker pull ghcr.io/open-webui/open-webui:main
    
    - name: Tag webui image 
      id: tag-webui-image
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        IMAGE_TAG: webui
      run: |
        docker tag ghcr.io/open-webui/open-webui:main ghcr.io/open-webui/open-webui:$IMAGE_TAG
        docker tag ghcr.io/open-webui/open-webui:${IMAGE_TAG} $ECR_REPOSITORY:${IMAGE_TAG}

    - name: Pull dashboards
      id: pull-dashboards-for-prov
      env: 
        GITHUB_REPO: https://github.com/EmlBogdan/dashboards
      run: |
        git clone ${GITHUB_REPO} dashboards
      
    - name: Pull alerts
      id: pull-alerts-for-prov
      env: 
        GITHUB_REPO: https://github.com/EmlBogdan/alert_rules . 
      run: |
        git clone ${GITHUB_REPO} rules  
      

    - name: Build grafana image 
      id: build-grafana-image
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
      run: |
        docker build -t grafana:latest -f grafana.Dockerfile .
    
    - name: Tag grafana image 
      id: tag-grafana-image
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        IMAGE_TAG: grafana
      run: |
        docker tag grafana:latest grafana:$IMAGE_TAG
        docker tag grafana:${IMAGE_TAG} $ECR_REPOSITORY:${IMAGE_TAG}

    - name: Pull prometheus image 
      id: build-prometheus-image
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
      run: |
        docker pull prom/prometheus
    
    - name: Tag prometheus image 
      id: tag-prometheus-image
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        IMAGE_TAG: prometheus
      run: |
        docker tag prom/prometheus:latest prom/prometheus:$IMAGE_TAG
        docker tag prom/prometheus:${IMAGE_TAG} $ECR_REPOSITORY:${IMAGE_TAG}


    - name: Push images
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
      id: push-images
      run: |
        docker push ${ECR_REPOSITORY}:ollama
        docker push ${ECR_REPOSITORY}:webui
        docker push ${ECR_REPOSITORY}:grafana
        docker push ${ECR_REPOSITORY}:prometheus
      


