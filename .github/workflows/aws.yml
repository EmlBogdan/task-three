    - name: Build grafana image 
      id: build-grafana-image
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
      run: |
        docker build -t grafana-base-image:latest -f images/grafana.Dockerfile .
    
    - name: Tag grafana image 
      id: tag-grafana-image
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        IMAGE_TAG: grafana-base-image
      run: |
        docker tag grafana-base-image:latest grafana-base-image:$IMAGE_TAG
        docker tag grafana-base-image:${IMAGE_TAG} $ECR_REPOSITORY:${IMAGE_TAG}


    - name: Push images
      env:
        ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
      id: push-images
      run: |
        docker push ${ECR_REPOSITORY}:grafana-base-image
    
    

