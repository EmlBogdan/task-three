# This workflow will build and push a new container image to Amazon ECR,
# and then will deploy a new task definition to Amazon ECS, when there is a push to the "main" branch.
#
# To use this workflow, you will need to complete the following set-up steps:
#
# 1. Create an ECR repository to store your images.
#    For example: `aws ecr create-repository --repository-name my-ecr-repo --region us-east-2`.
#    Replace the value of the `ECR_REPOSITORY` environment variable in the workflow below with your repository's name.
#    Replace the value of the `AWS_REGION` environment variable in the workflow below with your repository's region.
#
# 2. Create an ECS task definition, an ECS cluster, and an ECS service.
#    For example, follow the Getting Started guide on the ECS console:
#      https://us-east-2.console.aws.amazon.com/ecs/home?region=us-east-2#/firstRun
#    Replace the value of the `ECS_SERVICE` environment variable in the workflow below with the name you set for the Amazon ECS service.
#    Replace the value of the `ECS_CLUSTER` environment variable in the workflow below with the name you set for the cluster.
#
# 3. Store your ECS task definition as a JSON file in your repository.
#    The format should follow the output of `aws ecs register-task-definition --generate-cli-skeleton`.
#    Replace the value of the `ECS_TASK_DEFINITION` environment variable in the workflow below with the path to the JSON file.
#    Replace the value of the `CONTAINER_NAME` environment variable in the workflow below with the name of the container
#    in the `containerDefinitions` section of the task definition.
#
# 4. Store an IAM user access key in GitHub Actions secrets named `AWS_ACCESS_KEY_ID` and `AWS_SECRET_ACCESS_KEY`.
#    See the documentation for each action used below for the recommended IAM policies for this IAM user,
#    and best practices on handling the access key credentials.

name: Deploy to Amazon ECS

on:
  push:
    tags:
      - 'v*'

jobs:
  build-ollama:
    name: Build ollama
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      is_changed: ${{ steps.changes.outputs.src }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            src:
              - 'images/ollama/**'

      - name: Build ollama
        if: steps.changes.outputs.src == 'true'
        id: build-ollama-image
        run: |
          docker build -t ollama:latest -f images/ollama/ollama.Dockerfile .  
          docker save -o ollama-image.tar ollama:latest

      - name: Configure AWS credentials
        if: steps.changes.outputs.src == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{secrets.AWS_IAM_ROLE}}
          aws-region: us-east-1
          role-session-name: GHActionsSession

      - name: Login to Amazon ECR
        if: steps.changes.outputs.src == 'true'
        id: login-ecr
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        run: | 
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REPOSITORY

      - name: Tag ollama image 
        if: steps.changes.outputs.src == 'true'
        id: tag-ollama-image
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
          IMAGE_TAG: ollama_${{github.ref_name}}
        run: |
          docker tag ollama:latest $IMAGE_TAG
          docker tag ${IMAGE_TAG} $ECR_REPOSITORY:${IMAGE_TAG}

      - name: Push images
        if: steps.changes.outputs.src == 'true'
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        id: push-images
        run: |
          docker push ${ECR_REPOSITORY}:ollama_${{github.ref_name}}
      
  deploy-ollama:
    name: Deploy ollama
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    needs: build-ollama
    if: needs.build-ollama.outputs.is_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Configure AWS credentials
        if: steps.changes.outputs.src == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{secrets.AWS_IAM_ROLE}}
          aws-region: us-east-1
          role-session-name: GHActionsSession

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition ollama --query taskDefinition > task-definition.json 
        
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        with:
          task-definition: task-definition.json
          container-name: ollama-container
          image: "${{env.ECR_REPOSITORY}}:ollama_${{github.ref_name}}"
      

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: ollama
          cluster: ollama-cluster
          wait-for-service-stability: true

  build-grafana:
    name: Build grafana
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      is_changed: ${{ steps.changes.outputs.src }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            src:
              - 'images/grafana/**'

      - name: Pull dashboards
        id: pull-dashboards-for-prov
        if: steps.changes.outputs.src == 'true'
        env: 
          GITHUB_REPO: https://github.com/EmlBogdan/dashboards
        run: |
          git clone ${GITHUB_REPO} dashboards
        
      - name: Pull alerts
        id: pull-alerts-for-prov
        if: steps.changes.outputs.src == 'true'
        env: 
          GITHUB_REPO: https://github.com/EmlBogdan/alert_rules
        run: |
          git clone ${GITHUB_REPO} rules

      - name: Build grafana
        if: steps.changes.outputs.src == 'true'
        id: build-grafana-image
        run: |
          docker build -t grafana:latest -f images/grafana/grafana.Dockerfile .  
          docker save -o grafana-image.tar grafana:latest
      
      - name: Configure AWS credentials
        if: steps.changes.outputs.src == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{secrets.AWS_IAM_ROLE}}
          aws-region: us-east-1
          role-session-name: GHActionsSession

      - name: Login to Amazon ECR
        if: steps.changes.outputs.src == 'true'
        id: login-ecr
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        run: | 
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REPOSITORY

      - name: Tag grafana image 
        if: steps.changes.outputs.src == 'true'
        id: tag-grafana-image
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
          IMAGE_TAG: grafana_${{github.ref_name}}
        run: |
          docker tag grafana:latest $IMAGE_TAG
          docker tag ${IMAGE_TAG} $ECR_REPOSITORY:${IMAGE_TAG}

      - name: Push images
        if: steps.changes.outputs.src == 'true'
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        id: push-images
        run: |
          docker push ${ECR_REPOSITORY}:grafana_${{github.ref_name}}

  deploy-grafana:
    name: Deploy grafana
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    needs: build-grafana
    if: needs.build-grafana.outputs.is_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: steps.changes.outputs.src == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{secrets.AWS_IAM_ROLE}}
          aws-region: us-east-1
          role-session-name: GHActionsSession

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition grafana --query taskDefinition > task-definition.json 
        
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        with:
          task-definition: task-definition.json
          container-name: grafana-container
          image: "${{env.ECR_REPOSITORY}}:grafana_${{github.ref_name}}"
      

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: grafana
          cluster: ollama-cluster
          wait-for-service-stability: true

  build-prometheus:
    name: Build prometheus
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    outputs:
      is_changed: ${{ steps.changes.outputs.src }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - uses: dorny/paths-filter@v4
        id: changes
        with:
          filters: |
            src:
              - 'images/prometheus/**'

      - name: Build prometheus
        if: steps.changes.outputs.src == 'true'
        id: build-prometheus-image
        run: |
          docker build -t prometheus:latest -f images/prometheus/prometheus.Dockerfile .  
          docker save -o prometheus-image.tar prometheus:latest

      - name: Configure AWS credentials
        if: steps.changes.outputs.src == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{secrets.AWS_IAM_ROLE}}
          aws-region: us-east-1
          role-session-name: GHActionsSession

      - name: Login to Amazon ECR
        if: steps.changes.outputs.src == 'true'
        id: login-ecr
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        run: | 
          aws ecr get-login-password --region us-east-1 | docker login --username AWS --password-stdin $ECR_REPOSITORY

      - name: Tag prometheus image 
        if: steps.changes.outputs.src == 'true'
        id: tag-prometheus-image
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
          IMAGE_TAG: prometheus_${{github.ref_name}}
        run: |
          docker tag prometheus:latest $IMAGE_TAG
          docker tag ${IMAGE_TAG} $ECR_REPOSITORY:${IMAGE_TAG}

      - name: Push images
        if: steps.changes.outputs.src == 'true'
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        id: push-images
        run: |
          docker push ${ECR_REPOSITORY}:${{github.ref_name}}

  deploy-prometheus:
    name: Deploy prometheus
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    needs: build-prometheus
    if: needs.build-prometheus.outputs.is_changed == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        if: steps.changes.outputs.src == 'true'
        uses: aws-actions/configure-aws-credentials@v6.2.3
        with:
          role-to-assume: ${{secrets.AWS_IAM_ROLE}}
          aws-region: us-east-1
          role-session-name: GHActionsSession

      - name: Download task definition
        run: |
          aws ecs describe-task-definition --task-definition prometheus --query taskDefinition > task-definition.json 
        
      - name: Fill in the new image ID in the Amazon ECS task definition
        id: task-def
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        env:
          ECR_REPOSITORY: 324062893129.dkr.ecr.us-east-1.amazonaws.com/ollama-repository
        with:
          task-definition: task-definition.json
          container-name: prometheus-container
          image: "${{env.ECR_REPOSITORY}}:prometheus_${{github.ref_name}}"
      

      - name: Deploy Amazon ECS task definition
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.task-def.outputs.task-definition }}
          service: prometheus
          cluster: ollama-cluster
          wait-for-service-stability: true
  
  send-mail:
    name: Send mail notification
    needs: [deploy-ollama, deploy-grafana, deploy-prometheus]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send mail
        uses: dawidd6/action-send-mail@v18
        with: 
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{secrets.MAIL_USERNAME}}
          password: ${{secrets.MAIL_PASSWORD}}
          subject: "Github actions pipeline status"
          to: bieme@softserveinc.com
          from: GitHub Actions
          body: | 
            Deploy pipeline finished with ${{ job.status }} status.


        





      

    

